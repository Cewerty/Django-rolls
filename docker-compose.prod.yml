# docker-compose.prod.yml
version: '3.8'

services:
  web:
    build: 
      context: .
      target: final  # Копируем только из final stage
    ports:
      - "10810:8000"
    volumes:
      - ./staticfiles:/app/staticfiles
      - ./db.sqlite3:/app/db.sqlite3
    restart: unless-stopped
    environment:
      - DEBUG=0
      - ALLOWED_HOSTS=192.168.170.40
    command: /app/.venv/bin/gunicorn project.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 30
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports:
      - "10811:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./staticfiles:/app/staticfiles
    depends_on:
      - web
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"
